{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Nyondo Hardware</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{% static 'nyondo_app/css/accounts/login.css' %}">

</head>

<body>

<div class="login-card">

    <!-- LOGO -->

    <div class="logo">

        <h1>
            Nyondo <span>Hardware</span>
        </h1>

        <p>
            Stock & Sales Management System
        </p>

    </div>

    <!-- DJANGO MESSAGES -->

    {% if messages %}

        {% for message in messages %}

            <div class="message 
                {% if message.tags == 'error' %}
                    error
                {% else %}
                    success
                {% endif %}
            ">

                {{ message }}

            </div>

        {% endfor %}

    {% endif %}

    <!-- LOGIN FORM -->

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">

            <label>Username</label>

            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >

        </div>

        <div class="form-group">

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >

        </div>

        <button type="submit" class="btn">
            Login
        </button>

    </form>

    <!-- FOOTER -->

    <div class="footer">

        Secure Inventory & POS System

    </div>

</div>

</body>
</html>
