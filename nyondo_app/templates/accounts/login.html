<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Nyondo Hardware</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            background: #1f2937;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            width: 380px;
            background: white;
            border-radius: 8px;
            padding: 35px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
        }

        .title {
            text-align: center;
            font-size: 22px;
            margin-bottom: 20px;
            color: #1f2937;
        }

        .title span {
            color: #f4b400;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            font-size: 13px;
            display: block;
            margin-bottom: 5px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
        }

        input:focus {
            border-color: #f4b400;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #f4b400;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #d89d00;
        }

        .error {
            color: red;
            font-size: 13px;
            text-align: center;
            margin-bottom: 10px;
        }

        .footer {
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
            color: #777;
        }

    </style>
</head>

<body>

<div class="login-card">

    <div class="title">
        Nyondo <span>Hardware</span>
    </div>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required>
        </div>

        <button type="submit" class="btn">Login</button>
    </form>

    <div class="footer">
        Secure Stock & Sales System
    </div>

</div>

</body>
</html>
