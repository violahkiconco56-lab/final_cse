{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Supplier Credit</title>

    <link rel="stylesheet" href="{% static 'nyondo_app/css/nyondo/delete_credit.css' %}">
</head>

<body>

<div class="container">

    <h2>Delete Credit</h2>

    <p class="warning">
        Are you sure you want to delete this supplier credit?
        <br><br>
        <strong>{{ credit.supplier.name }} - {{ credit.item_name }}</strong>
    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit" class="btn btn-delete">
            Yes, Delete
        </button>

        <a href="{% url 'credit_list' %}" class="btn btn-cancel">
            Cancel
        </a>

    </form>

</div>

</body>
</html>
