<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Supplier Credit</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f1eef9;
            margin: 0;
            padding: 20px;
            color: #3d2f5f;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 24px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 18px 40px rgba(89, 70, 149, 0.08);
        }

        h2 {
            color: #7d5bad;
            margin-bottom: 15px;
        }

        .warning {
            margin-bottom: 20px;
            color: #3d2f5f;
        }

        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            color: white;
            margin: 5px;
            font-weight: 600;
        }

        .btn-delete {
            background: #8f3f72;
        }

        .btn-delete:hover {
            background: #6f345c;
        }

        .btn-cancel {
            background: #7d6ea5;
        }

        .btn-cancel:hover {
            background: #62578a;
        }

    </style>
</head>

<body>

<div class="container">

    <h2>Delete Credit</h2>

    <p class="warning">
        Are you sure you want to delete this supplier credit?
        <br><br>
        <strong>{{ credit.supplier.name }} - {{ credit.item_name }}</strong>
    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit" class="btn btn-delete">
            Yes, Delete
        </button>

        <a href="{% url 'credit_list' %}" class="btn btn-cancel">
            Cancel
        </a>

    </form>

</div>

</body>
</html>
