<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Supplier Credit</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        h2 {
            color: #dc3545;
            margin-bottom: 15px;
        }

        .warning {
            margin-bottom: 20px;
            color: #333;
        }

        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            color: white;
            margin: 5px;
        }

        .btn-delete {
            background: #dc3545;
        }

        .btn-delete:hover {
            background: #b52a37;
        }

        .btn-cancel {
            background: #6c757d;
        }

        .btn-cancel:hover {
            background: #5a6268;
        }

    </style>
</head>

<body>

<div class="container">

    <h2>Delete Credit</h2>

    <p class="warning">
        Are you sure you want to delete this supplier credit?
        <br><br>
        <strong>{{ credit.supplier.name }} - {{ credit.item_name }}</strong>
    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit" class="btn btn-delete">
            Yes, Delete
        </button>

        <a href="{% url 'credit_list' %}" class="btn btn-cancel">
            Cancel
        </a>

    </form>

</div>

</body>
</html>
