{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Supplier</title>
    <link rel="stylesheet" href="{% static 'nyondo_app/css/nyondo/add_credit.css' %}">
</head>
<body>

<div class="container">
    <h2>Add Supplier</h2>

    {% if messages %}
        {% for message in messages %}
            <div class="msg">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save Supplier</button>
    </form>

    <div class="actions-row">
        <a href="{% url 'supplier_list' %}" class="back">← Back to Supplier List</a>
        <a href="{% url 'credit_list' %}" class="back">← Back to Credit List</a>
    </div>
</div>

</body>
</html>
