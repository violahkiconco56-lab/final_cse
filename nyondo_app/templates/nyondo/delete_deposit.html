{% load static %}
<!-- templates/nyondo/delete_deposit.html -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Deposit</title>

    <link rel="stylesheet" href="{% static 'nyondo_app/css/nyondo/delete_deposit.css' %}">

</head>

<body>

<div class="container">

    <h2>Delete Deposit</h2>

    <p>
        Are you sure you want to delete
        <strong>{{ deposit.customer_name }}</strong>'s deposit?
    </p>

    <form method="POST">

        {% csrf_token %}

        <div class="buttons">

            <button type="submit" class="btn btn-delete">
                Yes, Delete
            </button>

            <a href="{% url 'deposit_list' %}" class="btn btn-cancel">
                Cancel
            </a>

        </div>

    </form>

</div>

</body>
</html>
