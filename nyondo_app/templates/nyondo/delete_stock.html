{% extends "base.html" %}

{% block content %}

<h2>Delete Stock</h2>

<p>Are you sure you want to delete:</p>

<h3>{{ stock.product_name }}</h3>

<form method="POST">
    {% csrf_token %}

    <button class="btn btn-danger">
        Yes, Delete
    </button>

    <a href="{% url 'stock_list' %}" class="btn btn-primary">
        Cancel
    </a>

</form>

{% endblock %}
